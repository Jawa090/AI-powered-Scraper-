name: CI
on: [push, pull_request]
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dataops_test
      CHECKPOINT_DB_URL: postgresql://postgres:postgres@localhost:5432/dataops_test
      DATAOPS_ENV_FILE: Backend/.env.test.example
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r Backend/requirements.txt -r requirements-dev.txt -r RAG/requirements.txt ruff mypy
      - name: Python correctness lint
        run: ruff check Backend Database RAG --select E9,F821,F822,F823,F631
      - name: Typed search and state contracts
        run: mypy --follow-imports=skip --ignore-missing-imports Database/search.py Backend/agents/graph/state.py
      - name: Compile every Python module
        run: python -m compileall -q Backend Database RAG
      - name: Migrate and seed twice
        run: |
          python Database/setup.py
          python Database/setup.py
      - name: Backend regression and RAG contract tests
        run: python -m pytest -c Backend/pytest.ini -o addopts= -m "not live" Backend/tests RAG/tests --tb=short -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AI Powered/package-lock.json
      - run: npm ci
        working-directory: AI Powered
      - run: npm run lint
        working-directory: AI Powered
      - run: npm run build
        working-directory: AI Powered
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare example configuration
        run: |
          cp Backend/.env.example Backend/.env
          cp RAG/.env.example RAG/.env
          python - <<'PY'
          import secrets
          from pathlib import Path
          backend = Path('Backend/.env')
          token = secrets.token_urlsafe(48)
          backend.write_text(backend.read_text().replace('JWT_SECRET=\n', 'JWT_SECRET=' + secrets.token_urlsafe(48) + '\n')
              .replace('RAG_SERVICE_TOKEN=\n', 'RAG_SERVICE_TOKEN=' + token + '\n'))
          rag = Path('RAG/.env')
          rag.write_text(rag.read_text().replace('rag-secret-token-change-in-production', token))
          PY
      - name: Build API, worker and RAG images
        run: docker compose build
      - name: Boot the complete deployment
        run: |
          docker compose up -d
          timeout 120 sh -c 'until curl -fsS http://localhost:8000/health/ready; do sleep 3; done'
          docker compose ps
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
