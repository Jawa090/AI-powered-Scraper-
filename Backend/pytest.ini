[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not live"
markers =
    unit: Fast unit tests with no external services or database
    integration: Integration tests requiring database / API server
    graph: LangGraph workflow and state graph execution tests
    live: Live tests requiring real external websites or APIs (excluded by default)
filterwarnings =
    ignore::DeprecationWarning
