version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dataops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dataops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - Backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/dataops
      - CHECKPOINT_DB_URL=postgresql://postgres:postgres@postgres:5432/dataops
      - RAG_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/dataops
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python Database/setup.py && python -m RAG.migrate"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - Backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/dataops
      - CHECKPOINT_DB_URL=postgresql://postgres:postgres@postgres:5432/dataops
      - RAG_SERVICE_URL=http://rag:8001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app:app", "--app-dir", "/app/Backend", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - Backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/dataops
      - CHECKPOINT_DB_URL=postgresql://postgres:postgres@postgres:5432/dataops
      - SELENIUM_MODE=remote
      - SELENIUM_REMOTE_URL=http://chrome:4444/wd/hub
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "worker"]

  rag:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - RAG/.env
    environment:
      - RAG_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/dataops
      - RAG_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "RAG"]

  chrome:
    image: selenium/standalone-chrome:4.18.1
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"

volumes:
  postgres_data:
